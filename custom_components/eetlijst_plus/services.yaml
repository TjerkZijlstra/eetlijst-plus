set_status:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: eetlijst_plus
    date:
      selector:
        date:
    status:
      selector:
        select:
          translation_key: status
          options:
            - eat_only
            - cook
            - got_groceries
            - not_attending
            - dont_know_yet
    guests:
      selector:
        number:
          min: 0
          max: 20
          mode: box
    comment:
      selector:
        text:
